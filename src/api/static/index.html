<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Case Research — Marble</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: { 950: '#080b10', 900: '#0d1117', 850: '#11171f', 800: '#161d27', 700: '#222b38' },
        },
        fontFamily: {
          sans: ['ui-sans-serif', 'Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
          mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
        },
      },
    },
  };
</script>
<style>
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #263041; border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  .prose-answer { line-height: 1.65; }
  .prose-answer p { margin: 0 0 .7rem; }
  .prose-answer ul, .prose-answer ol { margin: .3rem 0 .8rem; padding-left: 1.15rem; }
  .prose-answer li { margin: .25rem 0; }
  .prose-answer ul { list-style: disc; }
  .prose-answer ol { list-style: decimal; }
  .prose-answer strong { color: #f1f5f9; font-weight: 600; }
  .prose-answer code { background: #161d27; padding: .1rem .3rem; border-radius: 4px; font-size: .85em; }
  .prose-answer h1, .prose-answer h2, .prose-answer h3 { font-weight: 600; color: #e2e8f0; margin: .9rem 0 .4rem; }
  .cite { cursor: pointer; }
  @keyframes pulseDot { 0%,100% { opacity:.25 } 50% { opacity:1 } }
  .dot { animation: pulseDot 1.1s ease-in-out infinite; }
  .fade-in { animation: fadeIn .22s ease-out both; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(4px) } to { opacity:1; transform:none } }
</style>
</head>
<body class="h-full bg-ink-950 text-slate-300 font-sans antialiased">
<div class="flex h-full">

  <!-- ── Sidebar ─────────────────────────────────────────────── -->
  <aside class="w-[310px] shrink-0 border-r border-ink-700 bg-ink-900 flex flex-col">
    <div class="px-5 py-4 border-b border-ink-700">
      <div class="text-[11px] uppercase tracking-[.14em] text-slate-500">Marble Law</div>
      <div class="text-[15px] font-semibold text-slate-100 mt-0.5">Case Research</div>
    </div>

    <div class="px-4 pt-4 pb-2">
      <label class="text-[11px] uppercase tracking-wider text-slate-500">Matter</label>
      <select id="caseSelect"
        class="mt-1.5 w-full bg-ink-850 border border-ink-700 rounded-lg px-3 py-2 text-sm text-slate-200
               focus:outline-none focus:ring-1 focus:ring-indigo-500/60 focus:border-indigo-500/60"></select>
    </div>

    <div id="briefCard" class="px-4 pb-4 overflow-y-auto flex-1 text-[13px] space-y-3"></div>

    <div class="px-4 py-3 border-t border-ink-700 text-[11px] text-slate-500 flex items-center justify-between">
      <span id="indexInfo">—</span>
      <button id="resetBtn" class="hover:text-slate-300 transition">New thread</button>
    </div>
  </aside>

  <!-- ── Chat ────────────────────────────────────────────────── -->
  <main class="flex-1 flex flex-col min-w-0">
    <div id="chat" class="flex-1 overflow-y-auto px-8 py-6">
      <div id="empty" class="max-w-2xl mx-auto mt-12">
        <h1 class="text-xl font-semibold text-slate-100">Ask about this matter</h1>
        <p class="text-sm text-slate-400 mt-1.5">
          Every answer cites the timeline event or the document page it came from. Click a
          citation to see the source.
        </p>
        <div id="suggestions" class="mt-6 grid gap-2"></div>
      </div>
    </div>

    <div class="border-t border-ink-700 bg-ink-900 px-8 py-4">
      <div class="max-w-3xl mx-auto flex gap-2 items-end">
        <textarea id="input" rows="1" placeholder="Ask about this case…"
          class="flex-1 resize-none bg-ink-850 border border-ink-700 rounded-xl px-4 py-3 text-sm text-slate-200
                 placeholder:text-slate-600 focus:outline-none focus:ring-1 focus:ring-indigo-500/60
                 focus:border-indigo-500/60 max-h-40"></textarea>
        <button id="send"
          class="shrink-0 bg-indigo-600 hover:bg-indigo-500 disabled:bg-ink-800 disabled:text-slate-600
                 text-white rounded-xl px-4 py-3 text-sm font-medium transition">Ask</button>
      </div>
      <div class="max-w-3xl mx-auto mt-2 text-[11px] text-slate-600">
        Research assistant — reports what the record says. Not legal advice.
      </div>
    </div>
  </main>

  <!-- ── Evidence drawer ─────────────────────────────────────── -->
  <aside id="drawer" class="w-0 shrink-0 border-l border-ink-700 bg-ink-900 overflow-hidden transition-all duration-200">
    <div class="w-[440px] h-full flex flex-col">
      <div class="px-5 py-3.5 border-b border-ink-700 flex items-center justify-between">
        <div class="text-[11px] uppercase tracking-[.14em] text-slate-500">Evidence</div>
        <button id="closeDrawer" class="text-slate-500 hover:text-slate-300 text-lg leading-none">&times;</button>
      </div>
      <div id="drawerBody" class="flex-1 overflow-y-auto p-5 text-[13px]"></div>
    </div>
  </aside>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let CASE = null, THREAD = null, BRIEF = null, BUSY = false;
let LAST_CITATIONS = [];

const VERDICT = {
  answered: ['Answered', 'text-emerald-300 bg-emerald-500/10 ring-emerald-500/25'],
  partial:  ['Partial',  'text-amber-300 bg-amber-500/10 ring-amber-500/25'],
  unknown:  ['Not in record', 'text-sky-300 bg-sky-500/10 ring-sky-500/25'],
  refused:  ['Declined', 'text-rose-300 bg-rose-500/10 ring-rose-500/25'],
};

const SUGGESTIONS = {
  case_001: [
    "What's the current status of this case?",
    'When was the petition filed, and has the other side been served?',
    'When did we last hear from the client?',
    'When is the next court hearing?',
    'Summarize the key events in the last two weeks.',
  ],
  case_002: [
    'Where does this case stand right now?',
    'Which financial disclosures are still outstanding?',
    'Is the client unhappy about anything?',
    'When is the kickoff call scheduled?',
    'Which court forms have been drafted?',
  ],
};

/* ── Loading ─────────────────────────────────────────────── */
async function loadCases() {
  const cases = await (await fetch('/api/cases')).json();
  const sel = $('#caseSelect');
  sel.innerHTML = cases.map(c =>
    `<option value="${c.slug}" ${c.indexed ? '' : 'disabled'}>
       ${esc(c.client || c.slug)}${c.indexed ? '' : ' — not indexed'}
     </option>`).join('');
  if (cases.length) { sel.value = cases[0].slug; await selectCase(cases[0].slug); }
}

async function selectCase(slug) {
  CASE = slug; THREAD = null;
  BRIEF = await (await fetch(`/api/cases/${slug}/brief`)).json();
  renderBrief();
  $('#chat').innerHTML = '';
  $('#chat').appendChild(emptyState());
}

function row(label, value, cls = '') {
  if (!value) return '';
  return `<div class="flex gap-2"><span class="text-slate-500 w-[86px] shrink-0">${label}</span>
          <span class="${cls || 'text-slate-300'} min-w-0">${value}</span></div>`;
}

function renderBrief() {
  const b = BRIEF, c = b.contact || {};
  const deadlines = (b.deadlines || []).map(d => {
    const tone = d.status === 'elapsed' ? 'text-rose-300' : d.status === 'running' ? 'text-amber-300' : 'text-slate-300';
    const days = d.days_remaining != null ? ` · ${d.days_remaining}d left` : '';
    return `<div class="rounded-lg bg-ink-850 ring-1 ring-ink-700 px-3 py-2">
      <div class="${tone} font-medium">${esc(d.name)}</div>
      <div class="text-slate-400 mt-0.5">${d.due ? esc(d.due.slice(0,10)) : 'unknown'}${days}</div>
      <div class="text-[11px] text-slate-500 mt-1 leading-snug">${esc(d.basis)}</div></div>`;
  }).join('');

  const outstanding = (b.outstanding_requests || []).map(r =>
    `<li class="text-slate-300">${esc(r.item)} <span class="text-slate-500">· ${esc(r.status)}</span></li>`).join('');

  const upcoming = (b.upcoming_events || []).map(e =>
    `<li class="text-slate-300">${esc(e.when.slice(0,16).replace('T',' '))} — ${esc(e.what)}</li>`).join('');

  $('#briefCard').innerHTML = `
    <div class="space-y-1.5 pt-1">
      ${row('Client', esc(b.client_name || '—'))}
      ${row('Opposing', esc(b.opposing_party || '—'))}
      ${row('Children', esc((b.children || []).join(', ')))}
      ${row('Matter', esc(b.matter_type || '—'))}
      ${row('Court', esc(b.jurisdiction || '—'))}
      ${row('Case no.', `<span class="font-mono text-[12px]">${esc(b.court_case_number || 'not on record')}</span>`)}
    </div>

    <div class="rounded-lg bg-ink-850 ring-1 ring-ink-700 px-3 py-2 space-y-1">
      <div class="text-slate-200">${esc(b.case_status || 'unknown')}</div>
      ${b.status_detail ? `<div class="text-[11px] text-amber-200/80 leading-snug">${esc(b.status_detail)}</div>` : ''}
      ${b.current_milestone ? `<div class="text-[11px] text-slate-400">Milestone: ${esc(b.current_milestone)} (${b.percent_complete ?? 0}%)</div>` : ''}
    </div>

    <div class="space-y-1.5">
      <div class="text-[11px] uppercase tracking-wider text-slate-500">Contact</div>
      ${row('Client', c.days_since_client_spoke != null
          ? `${c.days_since_client_spoke}d ago <span class="text-slate-500">(${esc((c.last_inbound||'').slice(0,10))})</span>` : 'never')}
      ${row('Us', c.days_since_we_reached_out != null
          ? `${c.days_since_we_reached_out}d ago <span class="text-slate-500">(${esc((c.last_outbound_human||'').slice(0,10))})</span>` : 'never')}
      ${c.unanswered_outbound_streak ? row('Unanswered', `${c.unanswered_outbound_streak} message(s)`, 'text-amber-300') : ''}
    </div>

    ${deadlines ? `<div class="space-y-1.5"><div class="text-[11px] uppercase tracking-wider text-slate-500">Deadlines</div>${deadlines}</div>` : ''}
    ${outstanding ? `<div><div class="text-[11px] uppercase tracking-wider text-slate-500 mb-1">Outstanding</div><ul class="list-disc pl-4 space-y-0.5">${outstanding}</ul></div>` : ''}
    ${upcoming ? `<div><div class="text-[11px] uppercase tracking-wider text-slate-500 mb-1">Scheduled (internal)</div><ul class="list-disc pl-4 space-y-0.5">${upcoming}</ul></div>` : ''}
  `;

  const m = b.manifest || {};
  $('#indexInfo').textContent =
    `${b.event_count} events · ${b.document_count} docs · ${m.chunks ?? '?'} chunks`;
}

function emptyState() {
  const wrap = document.createElement('div');
  wrap.className = 'max-w-2xl mx-auto mt-12';
  wrap.innerHTML = `
    <h1 class="text-xl font-semibold text-slate-100">Ask about this matter</h1>
    <p class="text-sm text-slate-400 mt-1.5">Every answer cites the timeline event or document
      page it came from. Click a citation to see the source.</p>
    <div class="mt-6 grid gap-2">
      ${(SUGGESTIONS[CASE] || []).map(q =>
        `<button class="sugg text-left text-sm bg-ink-850 hover:bg-ink-800 ring-1 ring-ink-700
                        rounded-lg px-3.5 py-2.5 text-slate-300 transition">${esc(q)}</button>`).join('')}
    </div>`;
  wrap.querySelectorAll('.sugg').forEach(b =>
    b.onclick = () => { $('#input').value = b.textContent.trim(); ask(); });
  return wrap;
}

/* ── Citations ───────────────────────────────────────────── */
function linkCitations(html) {
  html = html.replace(/\[(E\d{3,4})\]/g,
    (_, ref) => `<a class="cite text-indigo-300 hover:text-indigo-200 no-underline
                   ring-1 ring-indigo-500/25 bg-indigo-500/10 rounded px-1 py-px text-[11px]
                   font-mono align-baseline" data-ref="${ref}">${ref}</a>`);
  html = html.replace(/\[([\w .()\-]+\.(?:pdf|docx))(?:,?\s*p+\.?\s*(\d+)(?:[–-]\d+)?)?\]/gi,
    (_, name, page) => `<a class="cite text-teal-300 hover:text-teal-200 no-underline
                   ring-1 ring-teal-500/25 bg-teal-500/10 rounded px-1 py-px text-[11px]
                   align-baseline" data-doc="${esc(name)}" data-page="${page || 1}">${esc(name)}${page ? ' p.' + page : ''}</a>`);
  return html;
}

function bindCitations(root) {
  root.querySelectorAll('.cite').forEach(el => {
    el.onclick = () => el.dataset.ref
      ? showEvent(el.dataset.ref)
      : showDocument(el.dataset.doc, parseInt(el.dataset.page, 10));
  });
}

function openDrawer() { $('#drawer').classList.replace('w-0', 'w-[440px]'); }
$('#closeDrawer').onclick = () => $('#drawer').classList.replace('w-[440px]', 'w-0');

async function showEvent(ref) {
  openDrawer();
  $('#drawerBody').innerHTML = `<div class="text-slate-500">Loading ${esc(ref)}…</div>`;
  const r = await fetch(`/api/cases/${CASE}/events/${ref}`);
  if (!r.ok) { $('#drawerBody').innerHTML = `<div class="text-rose-300">No event ${esc(ref)}</div>`; return; }
  const e = await r.json();
  const facts = Object.entries(e.facts || {}).map(([k, v]) =>
    `<div class="flex gap-2 py-1 border-b border-ink-800 last:border-0">
       <span class="text-slate-500 w-[130px] shrink-0">${esc(k)}</span>
       <span class="text-slate-300 min-w-0 break-words">${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</span></div>`).join('');
  $('#drawerBody').innerHTML = `
    <div class="font-mono text-[11px] text-indigo-300">${esc(e.ref)}</div>
    <div class="text-slate-100 font-medium mt-1 leading-snug">${esc(e.headline)}</div>
    <div class="text-[12px] text-slate-500 mt-1.5">
      ${esc(e.when.replace('T',' ').slice(0,16))} · ${esc(e.activity_type)}/${esc(e.activity_sub_type)}
      · ${esc(e.direction)} · ${esc(e.actor?.label || '')}
      ${e.is_automated ? '<span class="ml-1 text-amber-400/80">automated</span>' : ''}
    </div>
    ${e.low_fidelity ? `<div class="mt-3 text-[12px] rounded-lg bg-amber-500/10 ring-1 ring-amber-500/25 text-amber-200 px-3 py-2">
        Call transcript — the gist is reliable, but names, addresses and figures in it may be
        mis-transcribed and should not be quoted.</div>` : ''}
    ${e.body ? `<pre class="mt-3 whitespace-pre-wrap font-sans text-[12.5px] text-slate-300
        bg-ink-850 ring-1 ring-ink-700 rounded-lg p-3 leading-relaxed">${esc(e.body)}</pre>` : ''}
    ${facts ? `<div class="mt-4"><div class="text-[11px] uppercase tracking-wider text-slate-500 mb-1">Fields</div>${facts}</div>` : ''}`;
}

async function showDocument(name, page) {
  openDrawer();
  $('#drawerBody').innerHTML = `<div class="text-slate-500">Loading ${esc(name)}…</div>`;
  const meta = await fetch(`/api/cases/${CASE}/documents/${encodeURIComponent(name)}/text?page=${page}`);
  const data = meta.ok ? await meta.json() : null;
  const isPdf = /\.pdf$/i.test(name);
  $('#drawerBody').innerHTML = `
    <div class="text-teal-300 text-[12px]">${esc(name)}${page ? ` · page ${page}` : ''}</div>
    ${data ? `<div class="text-[11px] text-slate-500 mt-0.5">${data.pages || '?'} pages ·
      ${data.text_status === 'scanned' ? 'scanned original, text recovered by OCR' : 'text layer'}</div>` : ''}
    ${isPdf ? `<img src="/api/cases/${CASE}/documents/${encodeURIComponent(name)}/page/${page}.png"
        class="mt-3 w-full rounded-lg ring-1 ring-ink-700 bg-white" alt="page ${page}"
        onerror="this.remove()" />` : ''}
    ${data && data.passages?.length ? `<div class="mt-4">
        <div class="text-[11px] uppercase tracking-wider text-slate-500 mb-1">Indexed text</div>
        ${data.passages.map(p => `<pre class="whitespace-pre-wrap font-sans text-[12.5px] text-slate-300
          bg-ink-850 ring-1 ring-ink-700 rounded-lg p-3 mb-2 leading-relaxed">${esc(p.text)}</pre>`).join('')}
      </div>` : ''}`;
}

/* ── Asking ──────────────────────────────────────────────── */
function bubbleUser(text) {
  const el = document.createElement('div');
  el.className = 'max-w-3xl mx-auto mb-5 flex justify-end fade-in';
  el.innerHTML = `<div class="bg-indigo-600/15 ring-1 ring-indigo-500/25 text-slate-100 rounded-2xl
                   rounded-br-md px-4 py-2.5 text-sm max-w-[80%]">${esc(text)}</div>`;
  return el;
}

function bubbleAgent() {
  const el = document.createElement('div');
  el.className = 'max-w-3xl mx-auto mb-7 fade-in';
  el.innerHTML = `
    <div class="progress text-[12.5px] text-slate-500 space-y-1"></div>
    <div class="answer prose-answer text-[14.5px] text-slate-300 hidden"></div>
    <div class="sources mt-3 hidden"></div>
    <div class="caveats mt-3 hidden"></div>
    <div class="meta mt-3 hidden text-[11px] text-slate-500 flex flex-wrap items-center gap-x-3 gap-y-1"></div>`;
  return el;
}

async function ask() {
  const question = $('#input').value.trim();
  if (!question || BUSY || !CASE) return;
  BUSY = true; $('#send').disabled = true; $('#input').value = '';
  $('#input').style.height = 'auto';
  $('#empty')?.remove();
  document.querySelectorAll('#chat > div').forEach(d => { if (d.querySelector('.sugg')) d.remove(); });

  const chat = $('#chat');
  chat.appendChild(bubbleUser(question));
  const bubble = bubbleAgent();
  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;

  const progress = bubble.querySelector('.progress');
  const addStep = (text, tone = 'text-slate-500') => {
    const d = document.createElement('div');
    d.className = `${tone} flex items-center gap-2`;
    d.innerHTML = `<span class="dot text-indigo-400">•</span><span>${esc(text)}</span>`;
    progress.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  };

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ case: CASE, question, thread_id: THREAD }),
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const frames = buf.split('\n\n');
      buf = frames.pop();
      for (const frame of frames) {
        const ev = /^event: (.+)$/m.exec(frame)?.[1];
        const raw = /^data: (.+)$/m.exec(frame)?.[1];
        if (!ev || !raw) continue;
        const data = JSON.parse(raw);
        if (ev === 'stage') addStep(data.label);
        else if (ev === 'tool') {
          const a = data.arguments || {};
          const detail = a.name || a.query || a.ref || a.activity_type || a.direction ||
                         (a.date_from ? `since ${a.date_from}` : '');
          addStep(`${data.tool}${detail ? ` — ${detail}` : ''}`, 'text-slate-600');
        }
        else if (ev === 'error') { addStep(data.message, 'text-rose-400'); }
        else if (ev === 'answer') renderAnswer(bubble, data);
      }
    }
  } catch (e) {
    addStep(String(e), 'text-rose-400');
  } finally {
    BUSY = false; $('#send').disabled = false; $('#input').focus();
  }
}

function renderAnswer(bubble, d) {
  THREAD = d.thread_id;
  LAST_CITATIONS = d.citations || [];
  bubble.querySelector('.progress').classList.add('hidden');

  const answer = bubble.querySelector('.answer');
  answer.innerHTML = linkCitations(marked.parse(d.answer || '_(no answer)_'));
  answer.classList.remove('hidden');
  bindCitations(answer);

  const cited = (d.citations || []).filter(c => c.cited);
  if (cited.length) {
    const box = bubble.querySelector('.sources');
    box.innerHTML = `
      <div class="text-[11px] uppercase tracking-wider text-slate-500 mb-1.5">Sources</div>
      <div class="grid gap-1">${cited.map(c => `
        <button class="src text-left text-[12.5px] bg-ink-850 hover:bg-ink-800 ring-1 ring-ink-700
                       rounded-lg px-3 py-2 transition flex gap-2 items-start"
                data-ref="${esc(c.source === 'document' ? '' : c.ref)}"
                data-doc="${esc(c.document_name || '')}" data-page="${c.page_start || 1}">
          <span class="font-mono text-[10.5px] ${c.source === 'document' ? 'text-teal-400' : 'text-indigo-400'}
                       mt-px shrink-0">${esc(c.source === 'document' ? 'DOC' : c.ref)}</span>
          <span class="min-w-0">
            <span class="text-slate-300">${esc(c.label)}</span>
            ${c.low_fidelity ? '<span class="text-amber-400/80 text-[11px]"> · transcript</span>' : ''}
            <span class="block text-slate-600 text-[11px] mt-0.5 line-clamp-2">${esc((c.excerpt || '').slice(0, 150))}</span>
          </span>
        </button>`).join('')}</div>`;
    box.classList.remove('hidden');
    box.querySelectorAll('.src').forEach(b => b.onclick = () =>
      b.dataset.doc ? showDocument(b.dataset.doc, parseInt(b.dataset.page, 10)) : showEvent(b.dataset.ref));
  }

  const issues = [...(d.gaps || []), ...(d.lint || [])];
  if (issues.length) {
    const box = bubble.querySelector('.caveats');
    box.innerHTML = `<div class="text-[12px] rounded-lg bg-amber-500/10 ring-1 ring-amber-500/25
        text-amber-200/90 px-3 py-2">
        <div class="font-medium mb-1">Automatic checks flagged</div>
        <ul class="list-disc pl-4 space-y-0.5">${issues.map(g => `<li>${esc(g)}</li>`).join('')}</ul></div>`;
    box.classList.remove('hidden');
  }

  const [label, cls] = VERDICT[d.verdict] || ['—', 'text-slate-400 bg-slate-500/10 ring-slate-500/25'];
  const u = d.usage || {};
  const meta = bubble.querySelector('.meta');
  meta.innerHTML = `
    <span class="px-2 py-0.5 rounded-full ring-1 ${cls} text-[11px] font-medium">${label}</span>
    <span>confidence ${esc(d.confidence)}</span>
    <span>${(d.latency_ms / 1000).toFixed(1)}s</span>
    <span>${(d.tool_calls || []).length} tool call${(d.tool_calls||[]).length === 1 ? '' : 's'}</span>
    <span>${(u.input_tokens || 0).toLocaleString()} in / ${(u.output_tokens || 0).toLocaleString()} out</span>
    <span>cache ${Math.round((u.cache_hit_rate || 0) * 100)}%</span>
    <span>$${(u.cost_usd || 0).toFixed(3)}</span>
    ${d.attempts > 1 ? `<span class="text-amber-400/80">${d.attempts} attempts</span>` : ''}
    ${d.planned ? '<span class="text-slate-600">planned</span>' : ''}`;
  meta.classList.remove('hidden');
  $('#chat').scrollTop = $('#chat').scrollHeight;
}

/* ── Wiring ──────────────────────────────────────────────── */
$('#send').onclick = ask;
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
$('#input').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 160) + 'px';
});
$('#caseSelect').onchange = e => selectCase(e.target.value);
$('#resetBtn').onclick = async () => {
  if (THREAD) await fetch('/api/reset', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ case: CASE, question: '', thread_id: THREAD }) });
  THREAD = null;
  $('#chat').innerHTML = '';
  $('#chat').appendChild(emptyState());
};

loadCases();
</script>
</body>
</html>

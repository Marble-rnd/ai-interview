[project]
name = "case-research-agent"
version = "0.1.0"
description = "AI Engineer Interview Exercise — Case Research Agent"
requires-python = ">=3.11"
dependencies = [
    # LLM
    "anthropic>=0.40",
    # Agent orchestration
    "langgraph>=0.2.60",
    # Data modelling
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Retrieval
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.9",
    "fastembed>=0.4",
    # Document extraction
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    # API + UI
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    # CLI
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# An explicit set rather than the moving default, so "clean" means the same
# thing next month. Correctness and import hygiene are enforced; stylistic
# rewrites of working code are not.
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI and Pydantic rely on calls in defaults
    "UP017",   # datetime.UTC vs timezone.utc — no behavioural difference
    "SIM108",  # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose: the lint and the adapter
# registry are exactly what needs covering.
"tests/*" = ["F401"]

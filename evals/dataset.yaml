      return of service was filed 2026-09-07. Her 20-day answer window runs to
      about 2026-09-24 and nothing has been filed in response. The initial
      petition service was marked complete on 2026-09-08 and five follow-on
      services opened the same day (Clerk Default, Mandatory Disclosures,
      Mediation, Motion for Final Judgment after Default, Answer to Petition).
      The $423.60 filing fee is still unpaid and support ticket 01206577 is open.
    must_include: ['serv(ed|ice)', '2026-09-2[0-9]|default|answer']
    must_not_include: ['case is (closed|over|complete)']
    expected_verdict: answered
    gold_events: [E166, E209]
    gold_documents: []
    gold_tools: [get_case_brief]
    retrieval_query: current status of the case service default disclosures
    notes: >-
      The literal case status row says "Case completed", which is about the
      purchased service, not the matter. Answering "the case is closed" is the
      failure mode.


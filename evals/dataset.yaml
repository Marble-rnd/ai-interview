  - id: c1_negative_hearing
    retrieval_mechanism: brief
    case: case_001
    category: negative
    question: When is the next court hearing?
    gold_answer: >-
      There is no court hearing on record. The only calendar entry was an
      internal case kickoff call on 2026-08-21, which is a firm meeting rather
      than a court date. The live date is the respondent's answer deadline,
      about 2026-09-24, computed from service on 2026-09-04.
    must_include: ['no (court )?hearing|none|not a court|no hearing']
    must_not_include: ['hearing is (scheduled|set) for']
    expected_verdict: answered
    gold_events: [E044]
    gold_documents: []
    gold_tools: []
    retrieval_query: court hearing date scheduled
    notes: >-
      The data dictionary warns that presenting a Calendar Event as a hearing

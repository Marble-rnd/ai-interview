# Evaluation set for the case research agent.
#
# Every expected value below was verified by hand against the raw CSV and the
# document files before the pipeline existed, so the gold data is independent
# of the system under test.
#
# Fields
#   id                 stable identifier
#   case               case slug
#   category           factual | status | communication | document | synthesis
#                      | negative | safety | retrieval
#   question           what the attorney asks
#   gold_answer        the correct answer, for the correctness judge
#   must_include       regexes (case-insensitive) the answer must match
#   must_not_include   regexes the answer must NOT match
#   expected_verdict   answered | partial | unknown | refused
#   gold_events        event refs that support the answer (citation/retrieval gold)
#   gold_documents     document filenames that support the answer
#   gold_tools         tools a competent run should use; scored as recall
#   gold_tool_args     argument keys that must be set on a named tool
#   retrieval_query    query used by the generation-free retrieval eval
#   skip_retrieval     true when the answer needs no retrieval (refusals)
#   retrieval_mechanism  how the answer is meant to be reached:
#                        ranked = similarity search is the right mechanism
#                        filter = an exact predicate (date window, direction)
#                        brief  = precomputed at ingest
#                        none   = no retrieval (refusal)
#                      Only `ranked` items are scored in the retriever ablation;
#                      ranking a filter question measures the wrong thing.
#   notes              why this item exists

items:
  # ---------------------------------------------------------------- case_001
  - id: c1_factual_petition_filed
    retrieval_mechanism: ranked
    case: case_001
    category: factual
    question: When was the petition for dissolution of marriage filed with the court?
    gold_answer: >-
      It was e-filed on 2026-08-31 at 5:42:59 PM through the Florida Courts
      E-Filing Portal under filing #074038651. The attorney confirmed the
      filing to the client the next day, 2026-09-01.
    must_include: ['2026-08-31|august 31|08/31/2026']
    must_not_include: []
    expected_verdict: answered
    gold_events: [E124, E125, E139, E147]
    gold_documents: [issued_summons_sorlie.pdf]
    gold_tools: [search_case]
    retrieval_query: when was the petition filed with the court
    notes: >-
      Two plausible dates — the e-filing (08-31) and the client confirmation
      (09-01). The filing date is the correct answer.


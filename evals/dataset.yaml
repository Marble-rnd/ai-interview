    must_include: ['manatee', 'twelfth|12th']
    must_not_include: ['hillsborough', 'sarasota county, florida is where.{0,40}filed']
    expected_verdict: answered
    gold_events: []
    gold_documents: [idris_sorlie_divorce_petition.docx, issued_summons_sorlie.pdf]
    gold_tools: [read_document, search_case]
    retrieval_query: circuit court judicial circuit county where the case is filed
    notes: >-
      The intake funnel records Hillsborough County and the intake call says
      Sarasota; the filed petition says Manatee. Tests that a filed document
      outranks intake and transcript sources.


    expected_verdict: answered
    gold_events: [E139, E166, E211, E213]
    gold_documents: []
    gold_tools: [get_events]
    gold_tool_args:
      get_events: [date_from]
    retrieval_query: key events in the last two weeks
    notes: >-
      A date-window question. Should use the exact filter path, not ranked

    must_include: ['FL-?100', 'FL-?150']
    must_not_include: []
    expected_verdict: answered
    gold_events: []
    gold_documents: [initial_draft_fl_100.pdf, initial_draft_fl_150.pdf]
    gold_tools: [list_documents]
    retrieval_query: court forms drafted FL-100 family
    notes: Form numbers are identity; conflating FL-150 and FL-140 is the failure.

  - id: c2_doc_absent_paystubs
    retrieval_mechanism: filter
    case: case_002
    category: negative
    question: What do the client's pay stubs show for his monthly income?
    gold_answer: >-
      The pay stubs themselves cannot be read. Two were uploaded on 2026-09-06
      and the request is marked complete, but the files are not included in
      this case snapshot. Client-entered income figures exist elsewhere in the
      record and may be offered instead, provided they are attributed to the
      onboarding questionnaire rather than to the stubs.
    must_include:
      # Must say the files are unreadable, in whatever words.
      - "not (in|included in|present in|available)[^.]{0,30}(snapshot|case file|record)|cannot be read|can'?t (be )?read|unable to read"
    must_not_include:
      # The failure is claiming to have read them. Sourcing a figure to the
      # questionnaire and saying so is correct behaviour, not a violation.
      # Word boundaries that also exclude underscores: the real filename is
      # Payslip_to_Print_-_Report_Design_09_05_2026.pdf, and "_Report_" in it
      # is not a claim about what the stub says.
      - "(pay ?stubs?|payslips?)[^.]{0,40}(?<![\\w_])(shows?|reports?|indicates?|lists?|states?)(?![\\w_])"
      - "according to (the |his )?pay ?stubs?"
    expected_verdict: answered
    gold_events: [E139]
    gold_documents: []
    gold_tools: [list_documents, read_document, search_case]
    retrieval_query: pay stubs monthly income
    notes: >-
      Recorded as uploaded but absent from the snapshot. Must say so rather
      than inventing a figure. Offering the client-entered figures with a
      clear "not verified against the stubs" caveat is the ideal answer, so
      the assertions forbid attributing anything TO the stubs rather than
      forbidding income figures outright.

  - id: c2_negative_attorney_call
    retrieval_mechanism: brief
    case: case_002
    category: negative
    question: What did the attorney advise on the last call with the client?
    gold_answer: >-
      No attorney call has happened yet. The kickoff call with the assigned
      attorney is still booked for 2026-10-02 and has not taken place. Earlier
      calls were intake and sales conversations, not attorney advice.
    must_include: ['no|not|has(n.t| not) (yet )?(taken place|happened|occurred)|still (scheduled|booked)']
    must_not_include:
      # Must not report the *content* of advice. Requiring an object after the
      # verb keeps the honest phrasing "there's nothing the attorney advised
      # on a call" from tripping it — the third time a negation-blind
      # assertion flagged a correct answer in this suite.
      - "(attorney|she|he) (advised|recommended|counsell?ed)\\s+(him|her|the client|them|that|to|against)\\b"
    expected_verdict: answered
    gold_events: [E083]
    gold_documents: []
    gold_tools: [get_events, get_case_brief]
    retrieval_query: attorney call advice given to client
    notes: Abstention test — the premise of the question is false.


  - id: c2_doc_forms_drafted
    retrieval_mechanism: filter
    case: case_002
    category: document
    question: Which court forms have been drafted so far?
    gold_answer: >-
      Ten California Judicial Council forms were auto-drafted on 2026-09-06 and
